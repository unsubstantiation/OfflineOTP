apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.mikepenz.aboutlibraries.plugin.android'

android {
    namespace "org.shadowice.flocke.andotp"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "org.shadowice.flocke.andotp"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 39
        versionName "0.9.0.1"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            tasks.withType(JavaCompile) {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
    lint {
        abortOnError true
        // An initial focused gate, not a fabricated full-project lint baseline.
        checkOnly 'NewApi', 'InlinedApi', 'TrustAllX509TrustManager',
                'BadHostnameVerifier'
        warningsAsErrors true
    }
    buildFeatures {
        dataBinding = true
    }
    // Instrumentation and desktop tests consume the very same pinned interop vectors.
    sourceSets {
        androidTest.resources.srcDir '../desktop/src/test/resources'
    }
    flavorDimensions 'market'
    productFlavors {
        fdroid {
            dimension = 'market'
        }
        play {
            dimension = 'market'
            versionNameSuffix = "-play"
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Match Java bytecode without changing min/target SDK or introducing a toolchain download.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

dependencies {
    // Android-free OTP/parser/policy primitives shared with the desktop client.
    implementation project(':core')

    implementation('org.jetbrains.kotlin:kotlin-stdlib:2.4.21') {
        version { strictly '2.4.21' }
    }

    // Keep the shared lifecycle version on the newest release compatible with compileSdk 36 /
    // AGP 8.13.2; lifecycle 2.11's supported configuration requires compileSdk 37 and AGP 9.1+.
    def lifecycle_version = "2.10.0"

    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.lifecycle:lifecycle-process:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-common-java8:${lifecycle_version}"
    implementation "androidx.work:work-runtime:2.12.0"
    implementation 'com.google.android.material:material:1.14.0'

    //noinspection GradleDependency - because they messed up their version numbering
    implementation "commons-codec:commons-codec:1.23.0"
    implementation "com.github.aakira:ExpandableLayout:v1.6.0"
    implementation "com.heinrichreimersoftware:material-intro:2.0.0"
    implementation("com.journeyapps:zxing-android-embedded:4.3.0") { transitive = false }
    implementation('com.google.zxing:core:3.5.4')
    // USB/NFC security-key transports, OATH accounts, and FIDO2 PRF-based unlock.
    // The Android transport AAR is held at 3.1.0: its aar-metadata declares minCompileSdk=36, while
    // yubikit:android 3.2.0 and 3.2.1 declare minCompileSdk=37 and AGP 8.13.2 tops out at
    // compileSdk 36, so AGP's AAR metadata check rejects them (the JVM core/oath/fido modules carry
    // no such constraint and stay on the pinned 3.2.1 line).
    implementation 'com.yubico.yubikit:android:3.1.0'
    implementation 'com.yubico.yubikit:oath:3.2.1'
    implementation 'com.yubico.yubikit:fido:3.2.1'
    implementation "me.zhanghai.android.materialprogressbar:library:1.6.1"
    implementation "com.github.open-keychain.open-keychain:openpgp-api:v5.8.2"
    implementation "com.leinardi.android:speed-dial:3.3.0"
    // The View UI requires MaterialCardView: all app themes inherit MaterialComponents.Bridge.
    // Keep this version aligned with the build-time plugin in the root build.gradle.
    // 14.2.1 is the last release with the legacy View-based UI: 15.x drops it (Compose only)
    // and requires AGP 9, while AboutActivity still hosts Libs/LibsBuilder.
    implementation "com.mikepenz:aboutlibraries:14.2.1"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Local JVM unit tests (app/src/test). The tests stay off the android.jar stubs: only
    // org.json needs a real implementation on the host classpath because the platform's
    // org.json is "not mocked" in unit tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // Instrumentation tests (app/src/androidTest), for the on-device crypto/database vectors.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
