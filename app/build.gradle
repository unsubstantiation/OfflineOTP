apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.mikepenz.aboutlibraries.plugin.android'

android {
    namespace = "com.fairuniversal.offlineotp"
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.fairuniversal.offlineotp"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode rootProject.ext.buildDateVersionCode
        versionName rootProject.ext.buildDateVersion
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // Release signing is opt-in: CI provides the keystore and passwords as Gradle properties
    // (-PRELEASE_STORE_FILE=... etc.). Without them, assemble*Release keeps producing unsigned
    // APKs, so local and reproducible-build flows are unchanged.
    def releaseSigningConfigured = project.hasProperty('RELEASE_STORE_FILE') &&
            project.hasProperty('RELEASE_KEY_ALIAS')
    // A keystore without its credentials would otherwise reach apksigner with an empty password and
    // fail there with "keystore password was incorrect". Name the missing property instead, before
    // any APK is built, so a local reproducible-signing attempt fails the same way CI does.
    if (releaseSigningConfigured) {
        ['RELEASE_STORE_PASSWORD', 'RELEASE_KEY_PASSWORD'].each { name ->
            if (!project.hasProperty(name) || project.property(name).toString().isEmpty()) {
                throw new GradleException("${name} must be set (and non-empty) when RELEASE_STORE_FILE is used")
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.properties['RELEASE_STORE_PASSWORD'] ?: ''
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.properties['RELEASE_KEY_PASSWORD'] ?: ''
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix = ".dev"
            tasks.withType(JavaCompile) {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
    lint {
        abortOnError = true
        // An initial focused gate, not a fabricated full-project lint baseline.
        checkOnly 'NewApi', 'InlinedApi', 'TrustAllX509TrustManager',
                'BadHostnameVerifier'
        warningsAsErrors = true
    }
    buildFeatures {
        dataBinding = true
    }
    // Instrumentation and desktop tests consume the very same pinned interop vectors.
    sourceSets {
        main {
            // Generated UniFFI Kotlin bindings + NativeApi facade for the unified Rust
            // OpenPGP backend. Per-ABI cdylibs are staged into jniLibs by CI (cargo ndk).
            java.srcDir "$rootDir/rust/bindings/kotlin"
            jniLibs.srcDir 'src/main/jniLibs'
        }
        androidTest.resources.srcDir '../desktop/src/test/resources'
    }
    flavorDimensions 'market'
    productFlavors {
        fdroid {
            dimension = 'market'
        }
        play {
            dimension = 'market'
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        // Match the Java 11 bytecode required by the current Compose/AndroidX libraries.
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Match Java and Kotlin bytecode without changing Android min/target SDK or downloading a JDK.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

dependencies {
    // Android-free OTP/parser/policy primitives shared with the desktop client.
    implementation project(':core')
    implementation project(':ui-model')
    implementation project(':ui')

    implementation('org.jetbrains.kotlin:kotlin-stdlib:2.4.21') {
        version { strictly '2.4.21' }
    }

    // Lifecycle and the current YubiKit transport use compileSdk 37.
    def lifecycle_version = "2.11.0"

    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    androidTestImplementation 'androidx.recyclerview:recyclerview:1.4.0' // Historical card fixtures only.
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.lifecycle:lifecycle-process:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-common-java8:${lifecycle_version}"
    implementation "androidx.work:work-runtime:2.12.0"
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.biometric:biometric:1.4.0-rc01'

    //noinspection GradleDependency - because they messed up their version numbering
    implementation "commons-codec:commons-codec:1.23.0"
    implementation "com.github.aakira:ExpandableLayout:v1.6.0"
    implementation "com.heinrichreimersoftware:material-intro:2.0.0"
    implementation("com.journeyapps:zxing-android-embedded:4.3.0") { transitive = false }
    implementation('com.google.zxing:core:3.5.4')
    // USB/NFC security-key transports, OATH accounts, and FIDO2 PRF-based unlock.
    // Keep portable and Android modules aligned; 3.3.0's transport targets SDK 37.
    implementation 'com.yubico.yubikit:android:3.3.0'
    implementation 'com.yubico.yubikit:oath:3.3.0'
    implementation 'com.yubico.yubikit:fido:3.3.0'
    implementation "me.zhanghai.android.materialprogressbar:library:1.6.1"
    implementation "com.github.open-keychain.open-keychain:openpgp-api:v5.8.2"
    // JNA loads the unified Rust OpenPGP cdylib through the generated UniFFI bindings.
    // The AAR carries libjnidispatch.so for every Android ABI we package.
    implementation 'net.java.dev.jna:jna:5.19.1@aar'
    implementation "com.leinardi.android:speed-dial:3.3.0"
    // AboutActivity renders generated license JSON in shared Compose; no legacy View library.

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Local JVM unit tests (app/src/test). The tests stay off the android.jar stubs: only
    // org.json needs a real implementation on the host classpath because the platform's
    // org.json is "not mocked" in unit tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'

    // Instrumentation tests (app/src/androidTest), for the on-device crypto/database vectors.
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    // Device-only tests attach the real shared AbstractComposeView to ComponentActivity.
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.12.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.12.1'
}
