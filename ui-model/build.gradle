// Toolkit-free JVM/Android engine-to-presentation adapters. Portable render contracts live in
// :ui-contract; jvmHostMain alone depends on :core. This module is not an Apple engine API.
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.library'

kotlin {
    androidTarget {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }
    jvm('desktop') {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }

    sourceSets {
        commonMain.dependencies {
            api project(':ui-contract')
        }
        jvmHostMain {
            dependsOn commonMain
            dependencies { api project(':core') }
        }
        androidMain.dependsOn jvmHostMain
        desktopMain.dependsOn jvmHostMain
        desktopTest.dependencies {
            implementation 'junit:junit:4.13.2'
        }
    }
}

android {
    namespace = "com.fairuniversal.offlineotp.ui.model"
    compileSdk 37
    defaultConfig {
        minSdkVersion 28
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
