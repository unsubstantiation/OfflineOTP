name: OfflineOTP
options:
  # The generated project is not committed: `project.yml` is the reviewable definition, and
  # `xcodegen generate` recreates the rest. See ios/README.md.
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # The runner's Xcode is 16.4 (`macos-15`), so this is the version the project says it was made
  # with: bump it only together with the runner image. It is metadata; the format pin below, not
  # this, is what keeps older machines able to open the project.
  xcodeVersion: "16.4"
  # The *format*, unlike the toolchain, deliberately lags: XcodeGen defaults to the newest format it
  # knows (objectVersion 77), which no Xcode 15 can open at all. Pinning xcode15_3 keeps the project
  # openable by every Xcode from 15.3 upwards — including the 15.4 image this used to run on — while
  # Xcode 16.4 on `macos-15` reads it unchanged.
  projectFormat: xcode15_3

packages:
  # The format layer: vault, backup, entry document and token maths. Shared with the JVM clients
  # through the fixed vectors in desktop/src/test/resources/golden, not through code.
  YubiKit:
    url: https://github.com/Yubico/yubikit-swift.git
    revision: 03fe66d15b6e863e87a44c7a263b7bffedda9d79
  SwiftLog:
    url: https://github.com/apple/swift-log.git
    revision: ce592ae52f982c847a4efc0dd881cc9eb32d29f2
  OfflineOTPKit:
    path: .

settings:
  base:
    # Swift 5 language mode. The app is written for it; Swift 6's strict concurrency checking is a
    # separate migration, not something a first shell should absorb.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # No signing identity is needed to build for a simulator, and nothing here signs for a device.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  OfflineOTP:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # The asset catalog carries the app icon. Its PNG is generated from the shared artwork by
      # scripts/ios/generate-app-icon.py (like the macOS .icns) and is not committed; the
      # Contents.json beside it is, so the catalog is reviewable and XcodeGen can wire it up.
      - path: App/Resources
      # Shared brand vector artwork (`thumb_*.xml`), parsed and drawn by `:ui-contract` and
      # `:ui-foundation` (`BundledVectorVaultArtwork`) without copying the 466 XML files into `ios/`.
      - path: ../app/src/main/res/drawable
        includes:
          - "thumb_*.xml"
        buildPhase: resources
    dependencies:
      # Required: scripts/ios/build-compose-framework.sh must run before XcodeGen/build.
      # No SwiftUI authentication fallback when the framework is absent.
      - framework: Frameworks/OfflineOTPPresentation.xcframework
        embed: false
      - package: OfflineOTPKit
        product: OfflineOTPKit
      - package: YubiKit
        product: YubiKit
      - package: SwiftLog
        product: Logging
    entitlements:
      path: App/OfflineOTP.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    postBuildScripts:
      - name: Stamp AKST build version before signing
        script: 'python3 "$SRCROOT/../scripts/versioning/stamp-ios-version.py"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OfflineOTP
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Expose Documents/ in the iOS Files app ("On My iPhone -> OfflineOTP") so vaults and
        # encrypted backups can be inspected or copied directly on a physical device.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The app declares no networking at all, so there is no export-controlled cryptography to
        # report beyond the standard library imports.
        ITSAppUsesNonExemptEncryption: false
        # Face ID and live QR scanning are optional. iOS requires explicit purpose strings before
        # either protected API is first used; photo-library access remains limited to the system picker.
        NSFaceIDUsageDescription: >-
          Unlock your OfflineOTP vault with Face ID instead of typing its password. The vault stays
          encrypted with the password; this only releases a key kept on this device.
        NFCReaderUsageDescription: Read OATH account names from your security key after you choose NFC.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - A0000005272101
          - A0000006472F0001
        NSCameraUsageDescription: >-
          Scan an OTP QR code to add its account to your encrypted vault. The image is processed on
          this device and is not uploaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fairuniversal.offlineotp
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Without this the catalog compiles but no icon is chosen, and iOS draws the blank
        # placeholder — which is what every build before this shipped.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      # One shared scheme drives the simulator build and local/manual app unit tests.
      # CI builds the app but does not run the simulator XCTest step.
      testTargets:
        - OfflineOTPAppTests
      gatherCoverageData: false

  OfflineOTPAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: OfflineOTP
      - package: YubiKit
        product: YubiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fairuniversal.offlineotp.tests
        GENERATE_INFOPLIST_FILE: YES
