name: OfflineOTP
options:
  # The generated project is not committed: `project.yml` is the reviewable definition, and
  # `xcodegen generate` recreates the rest. See ios/README.md.
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # The runner's Xcode is 16.4 (`macos-15`), so this is the version the project says it was made
  # with: bump it only together with the runner image. It is metadata; the format pin below, not
  # this, is what keeps older machines able to open the project.
  xcodeVersion: "16.4"
  # The *format*, unlike the toolchain, deliberately lags: XcodeGen defaults to the newest format it
  # knows (objectVersion 77), which no Xcode 15 can open at all. Pinning xcode15_3 keeps the project
  # openable by every Xcode from 15.3 upwards — including the 15.4 image this used to run on — while
  # Xcode 16.4 on `macos-15` reads it unchanged.
  projectFormat: xcode15_3

packages:
  # The format layer: vault, backup, entry document and token maths. Shared with the JVM clients
  # through the fixed vectors in desktop/src/test/resources/golden, not through code.
  OfflineOTPKit:
    path: .

settings:
  base:
    # Swift 5 language mode. The app is written for it; Swift 6's strict concurrency checking is a
    # separate migration, not something a first shell should absorb.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # No signing identity is needed to build for a simulator, and nothing here signs for a device.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  OfflineOTP:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: OfflineOTPKit
        product: OfflineOTPKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OfflineOTP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Expose Documents/ in the iOS Files app ("On My iPhone -> OfflineOTP") so vaults and
        # encrypted backups can be inspected or copied directly on a physical device.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The app declares no networking at all, so there is no export-controlled cryptography to
        # report beyond the standard library imports.
        ITSAppUsesNonExemptEncryption: false
        # Face ID is optional and off until the person turns it on, but iOS refuses the prompt
        # outright without this sentence, so it has to ship. It is the only permission the app
        # declares: no camera, no photo library beyond the system picker, no network.
        NSFaceIDUsageDescription: >-
          Unlock your OfflineOTP vault with Face ID instead of typing its password. The vault stays
          encrypted with the password; this only releases a key kept on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fairuniversal.offlineotp
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      # One shared scheme drives the simulator build and local/manual app unit tests.
      # CI builds the app but does not run the simulator XCTest step.
      testTargets:
        - OfflineOTPAppTests
      gatherCoverageData: false

  OfflineOTPAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: OfflineOTP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fairuniversal.offlineotp.tests
        GENERATE_INFOPLIST_FILE: YES
