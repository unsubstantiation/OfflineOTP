[package]
name = "offlineotp_openpgp"
version = "0.1.0"
edition = "2021"
description = "OpenPGP encrypt/decrypt via rpgp for OfflineOTP — rpgp + UniFFI, 5/5"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"

[lib]
name = "offlineotp_openpgp"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
pgp = { version = "=0.21.1", default-features = false, features = ["bzip2"] }
rand = "=0.8.6"
uniffi = "=0.32.2"
thiserror = "=2.0.21"
zeroize = "=1.9.2"

[build-dependencies]
uniffi = { version = "=0.32.2", features = ["build"] }

[dev-dependencies]
tempfile = "=3.27.0"
