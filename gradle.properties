# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://gradle.org

android.useAndroidX=true

# AGP 9.x compatibility with external kotlin-gradle-plugin and Groovy build scripts
android.builtInKotlin=false
android.newDsl=false

# Silence disabled iOS native simulator test warnings on Linux/Windows hosts
kotlin.native.ignoreDisabledTargets=true

# reuse task outputs from any previous build
org.gradle.caching=true

# defaults to "summary" (suppress all warnings and log a summary at the end of the build)
org.gradle.warning.mode=all
android.nonTransitiveRClass=false

# Stable encoding/locale for generated resources and reports. CI also pins TZ.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Duser.timezone=UTC
