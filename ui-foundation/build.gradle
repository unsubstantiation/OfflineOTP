// Native-compatible production Compose UI. No dependency on :core, :ui-model or :ui.
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def presentationFramework = new org.jetbrains.kotlin.gradle.plugin.mpp.apple.XCFrameworkConfig(project, 'OfflineOTPPresentation')

kotlin {
    androidTarget {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8) }
    }
    jvm('desktop') {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11) }
    }
    iosArm64()
    iosSimulatorArm64()
    iosX64()
    targets.withType(org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget).configureEach {
        binaries.framework {
            baseName = 'OfflineOTPPresentation'
            isStatic = true
            export rootProject.findProject(':ui-contract')
            export rootProject.findProject(':shared-domain')
            presentationFramework.add(delegate)
        }
    }
    sourceSets {
        commonMain.dependencies {
            api project(':ui-contract')
            api project(':shared-domain')
            implementation 'org.jetbrains.compose.runtime:runtime:1.12.2'
            implementation 'org.jetbrains.compose.foundation:foundation:1.12.2'
            implementation 'org.jetbrains.compose.material3:material3:1.12.0-alpha03'
            api 'org.jetbrains.compose.ui:ui:1.12.2'
        }
    }
}

android {
    namespace = 'com.fairuniversal.offlineotp.ui.foundation'
    compileSdk 37
    defaultConfig { minSdkVersion 28 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
