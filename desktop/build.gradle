// Desktop Swing client. Pure-JVM: it depends on the Android-free :core and never references
// android.* or androidx.*. The kotlin-sandbox desktop compile (no Android stubs on the classpath)
// and a Python source guard enforce that boundary. Swing/AWT are JDK java.desktop modules, not
// third-party dependencies, so this module declares no UI library of its own.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-library'
apply plugin: 'application'

// 11, not the 1.8 used by the Android app and :core: the embedded OpenPGP engine
// (org.pgpainless:pgpainless-core) publishes a JVM 11 runtime requirement, and Gradle refuses to
// resolve it for a JVM 8 consumer. The packaging toolchain is JDK 17 either way.
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

application {
    // Top-level main() in desktop/Main.kt compiles to the MainKt entry class.
    mainClass = 'org.shadowice.flocke.andotp.desktop.MainKt'
}

// Brand artwork: both clients show the same issuer logos. The marks are the Android vector
// drawables in :app, which a JVM module cannot resolve as Android resources, so copy the
// thumb_*.xml files onto this module's classpath under /thumbnails/ (see ui/IssuerIcons.kt).
// The name -> file table in :core is generated by scripts/branding/generate_thumbnail_assets.py,
// and scripts/tests/test_desktop_issuer_icons.py fails when it drifts from the enum.
tasks.named('processResources') {
    from("$rootDir/app/src/main/res/drawable") {
        include 'thumb_*.xml'
        into 'thumbnails'
    }
}

// Reproducible distribution archives: strip zip timestamps and order entries deterministically so
// independent builds (see scripts/packaging/verify-desktop-build.sh) compare byte-for-byte.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Display tests are opt-in: ordinary CI/headless runs must never launch interactive windows.
// Pass -Dofflineotp.uiTests=true to Gradle on a machine with a real or virtual display.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    systemProperty 'offlineotp.uiTests', System.getProperty('offlineotp.uiTests', 'false')
}

// Native installer/app image through the JDK's jpackage (requires a full JDK 17+, not a JRE). The
// task is skipped when the running JDK has no jpackage, which keeps older toolchains working; the
// packaging README documents how release builds invoke it.
tasks.register('packageDesktop', Exec) {
    dependsOn 'installDist'
    group = 'distribution'
    description = 'Builds a native OfflineOTP app image with jpackage (JDK 17+).'

    def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')
    def jpackage = new File(System.getProperty('java.home'), isWindows ? 'bin/jpackage.exe' : 'bin/jpackage')
    executable = jpackage.absolutePath
    args = [
        '--type', 'app-image',
        '--name', 'OfflineOTP',
        '--input', layout.buildDirectory.dir('install/desktop/lib').get().asFile.absolutePath,
        '--main-jar', "${project.name}.jar",
        '--main-class', 'org.shadowice.flocke.andotp.desktop.MainKt',
        '--dest', layout.buildDirectory.dir('release').get().asFile.absolutePath,
    ]
    // jpackage requires a platform-specific icon format. Other platforms keep their default.
    def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def icon = isWindows ? file('packaging/offlineotp.ico') :
        (osName.contains('linux') ? file('src/main/resources/offlineotp.png') : null)
    if (icon != null) {
        inputs.file(icon)
        args '--icon', icon.absolutePath
    }
    onlyIf { jpackage.canExecute() }
    doFirst { layout.buildDirectory.dir('release').get().asFile.mkdirs() }
}

dependencies {
    implementation('org.jetbrains.kotlin:kotlin-stdlib:2.4.21') {
        version { strictly '2.4.21' }
    }

    // All domain, OTP, parser, session and hardware logic comes from the shared module. Core's api
    // dependencies (org.json and the portable yubikit surface) arrive transitively.
    implementation project(':core')

    // Embedded OpenPGP engine for .json.gpg backups; the Android build instead talks to an
    // external OpenPGP provider, but both produce standard RFC 4880 messages. BouncyCastle
    // (bcprov/bcpg/bcutil-jdk18on) and slf4j-api arrive transitively.
    implementation 'org.pgpainless:pgpainless-core:2.0.4'

    // PC/SC security-key support through the yubikit desktop module. Raw HID is intentionally
    // excluded: OfflineOTP only uses javax.smartcardio (CCID) transports, never hid4java. The
    // portable core/oath/fido modules arrive through :core; this adds only the PC/SC discovery.
    implementation('com.yubico.yubikit:desktop:3.2.1') {
        exclude group: 'org.hid4java', module: 'hid4java'
    }

    // QR image-file import (zxing core only; no camera or screen capture). Same version the
    // Android app uses, so decode behavior matches across platforms.
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
}
