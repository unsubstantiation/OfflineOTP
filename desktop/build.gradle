// Shared desktop engine and AWT artwork utilities. Compose owns all desktop UI and packaging.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-library'

// 11, not the 1.8 used by the Android app and :core: the embedded OpenPGP engine
// (org.pgpainless:pgpainless-core) publishes a JVM 11 runtime requirement, and Gradle refuses to
// resolve it for a JVM 8 consumer. The packaging toolchain is JDK 17 either way.
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
    sourceSets {
        main {
            // Generated UniFFI Kotlin bindings + NativeApi byte-array facade for the
            // unified Rust OpenPGP backend. The no-Gradle sandbox omits this directory
            // and exercises RpgpOpenPgpPort's explicit PGPainless fallback instead.
            kotlin.srcDir("$rootDir/rust/bindings/kotlin")
        }
    }
}

// Brand artwork: both clients show the same issuer logos. The marks are the Android vector
// drawables in :app, which a JVM module cannot resolve as Android resources, so copy the
// thumb_*.xml files onto this module's classpath under /thumbnails/ (see ui/IssuerIcons.kt).
// The name -> file table in :core is generated by scripts/branding/generate_thumbnail_assets.py,
// and scripts/tests/test_desktop_issuer_icons.py fails when it drifts from the enum.
tasks.named('processResources') {
    from("$rootDir/app/src/main/res/drawable") {
        include 'thumb_*.xml'
        into 'thumbnails'
    }
}

// Reproducible distribution archives: strip zip timestamps and order entries deterministically so
// independent builds (see scripts/packaging/verify-desktop-build.sh) compare byte-for-byte.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    implementation('org.jetbrains.kotlin:kotlin-stdlib:2.4.21') {
        version { strictly '2.4.21' }
    }

    // All domain, OTP, parser, session and hardware logic comes from the shared module. Core's api
    // dependencies (org.json and the portable yubikit surface) arrive transitively.
    implementation project(':core')

    // Toolkit-free frame layer shared with the Compose host.
    // It is pure Kotlin: no Compose artifact reaches this module.
    implementation project(':ui-model')

    // Embedded OpenPGP engine for .json.gpg backups; the Android build instead talks to an
    // external OpenPGP provider, but both produce standard RFC 4880 messages. BouncyCastle
    // (bcprov/bcpg/bcutil-jdk18on) and slf4j-api arrive transitively.
    implementation 'org.pgpainless:pgpainless-core:2.0.4'

    // JNA loads the unified Rust OpenPGP cdylib through the generated UniFFI bindings.
    implementation 'net.java.dev.jna:jna:5.14.0'

    // PC/SC security-key support through the yubikit desktop module. Raw HID is intentionally
    // excluded: OfflineOTP only uses javax.smartcardio (CCID) transports, never hid4java. The
    // portable core/oath/fido modules arrive through :core; this adds only the PC/SC discovery.
    implementation('com.yubico.yubikit:desktop:3.2.1') {
        exclude group: 'org.hid4java', module: 'hid4java'
    }

    // QR image-file import (zxing core only; no camera or screen capture). Same version the
    // Android app uses, so decode behavior matches across platforms.
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
}

// Retain old command aliases without a second application or fallback distribution.
tasks.register('run') { dependsOn ':desktop-compose:run' }
tasks.register('packageDesktop') { dependsOn ':desktop-compose:packageDesktop' }
