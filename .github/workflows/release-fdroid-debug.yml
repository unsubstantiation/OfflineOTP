name: Release fdroid debug apk

# Publishes the fdroid DEBUG APK as a GitHub Release for a pushed v* tag (or for an
# existing tag given to a manual run). Debug builds install under the ".dev" application
# ID suffix from app/build.gradle and are signed with the runner's freshly generated
# debug key, so every release here is a fresh-install test build, not an updatable
# production build. The release notes generated below say so next to the download.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v2026-10-21)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish fdroid debug apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build fdroid debug APK
        run: ./gradlew --no-daemon :app:assembleFdroidDebug

      - name: Verify signature and stage release files
        run: |
          set -euo pipefail
          version="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)"
          test -n "$version"
          apk="OfflineOTP-${version}-fdroid-debug.apk"
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose "$apk"
          cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -n 1)"
          test -n "$cert"
          sha256sum "$apk" > SHA256SUMS.txt
          {
            echo "APK=$apk"
            echo "VERSION=$version"
            echo "CERT_SHA256=$cert"
            echo "COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          cat SHA256SUMS.txt
          echo "Signing certificate SHA-256: $cert"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(cut -d' ' -f1 SHA256SUMS.txt)"
          cat > release-notes.md <<'EOF'
          OfflineOTP __VERSION__ — fdroid debug build (__TAG__), from commit __COMMIT__.
          Requires Android 9 (API 28) or later. The app declares no INTERNET permission.

          **Download:** `__APK__`
          **SHA-256:** `__SHA256__` (also in the attached `SHA256SUMS.txt`)
          **Signing certificate SHA-256:** `__CERT__`

          Please read before installing:

          - This is a **debug build**. It installs as a separate app
            (`org.shadowice.flocke.andotp.dev`, shown as version __VERSION__-dev)
            alongside andOTP/OfflineOTP; it does not replace them.
          - It is signed with a CI-generated debug key, and every CI build generates a
            different one. Updating to a future debug build therefore requires
            uninstalling first, which erases the vault. Export a portable backup and
            verify that it restores before switching builds.
          - On initial testing the app appears stable and backwards compatible with
            andOTP backup files. It is an early build and should not replace andOTP
            yet. Reports of any issues are welcome.
          - Google Play Protect may warn that the app and developer are unknown.

          Changes are listed in the
          [changelog](https://github.com/__REPO__/blob/__TAG__/CHANGELOG.md).
          EOF
          sed -i \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__TAG__|$TAG|g" \
            -e "s|__APK__|$APK|g" \
            -e "s|__SHA256__|$sha|g" \
            -e "s|__CERT__|$CERT_SHA256|g" \
            -e "s|__COMMIT__|$COMMIT|g" \
            -e "s|__REPO__|$GITHUB_REPOSITORY|g" \
            release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" SHA256SUMS.txt --verify-tag \
              --title "OfflineOTP ${VERSION} fdroid debug (${TAG})" \
              --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease,assets
