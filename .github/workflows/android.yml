name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  signing-preflight:
    # Release signing is opt-in. The `secrets` context is not available to job-level `if`
    # expressions, so this tiny job publishes whether the keystore secret exists and lets the
    # signed-release job be *skipped* instead of *failed* when signing is not configured.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: android-release
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check release signing secret
        id: check
        shell: bash
        env:
          # ANDROID_KEYSTORE_BASE64 is the name this repository uses; the ANDROID_RELEASE_* pair is
          # still honoured so an older setup keeps working.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not configured; skipping the signed release build. See docs/release-signing.md to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  sign-release:
    # Builds and verifies signed release APKs only when the keystore is configured; otherwise
    # the job is skipped. No debug APK is built — use a local Gradle build for development.
    needs: signing-preflight
    if: needs.signing-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep the v3 default SDK tools while updating the action runtime.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured; a base64-encoded release keystore is required."
            exit 1
          fi
          mkdir -p signing
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/OfflineOTP-release-keystore.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [[ ! -s signing/OfflineOTP-release-keystore.jks ]]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi
      - name: Find the key alias and the passwords
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          # keytool makes the key password equal to the store password unless it is given
          # -keypass, so one secret normally covers both; a distinct one still wins if set.
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # A configured keystore with a missing password would otherwise fail inside Gradle with
          # "keystore password was incorrect"; name the secret instead. Values are never printed.
          if [[ -z "$STORE_PASSWORD" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured; it is required once the keystore is set."
            exit 1
          fi
          if [[ -z "$KEY_PASSWORD" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured; it is required once the keystore is set."
            exit 1
          fi
          # android-release is the canonical alias; the previous offlineotp-* value is obsolete.
          # The alias is not a secret: if ANDROID_RELEASE_KEY_ALIAS is not set we default to
          # android-release (matches docs/release-signing.md -alias android-release).
          # A keystore holding several private keys still needs the explicit secret.
          if [[ -z "$KEY_ALIAS" ]]; then
            KEY_ALIAS="android-release"
            echo "::notice::Using key alias '$KEY_ALIAS' (set ANDROID_RELEASE_KEY_ALIAS to override for a different keystore)."
          fi
          echo "::add-mask::$KEY_ALIAS"
          {
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APKs
        shell: bash
        # The three credentials reach Gradle as ORG_GRADLE_PROJECT_* environment variables instead
        # of -P arguments: they never show up in the process list, and no secret is substituted into
        # this script, so a password containing a quote, a backslash, $ or a space cannot break the
        # command or inject shell syntax. The values come from $GITHUB_ENV, so no `secrets` context
        # is interpolated here either.
        run: |
          set -euo pipefail
          : "${RELEASE_KEY_ALIAS:?missing}"
          : "${RELEASE_STORE_PASSWORD:?missing}"
          : "${RELEASE_KEY_PASSWORD:?missing}"
          export ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          ./gradlew --no-daemon :app:assembleFdroidRelease :app:assemblePlayRelease \
            -PRELEASE_STORE_FILE="$PWD/signing/OfflineOTP-release-keystore.jks"
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
                     app/build/outputs/apk/play/release/app-play-release.apk; do
            test -f "$apk"
            echo "::group::Verifying $apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk"
            echo "--- badging for $apk ---"
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "package:|application:|uses-sdk" || true
            if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -q "name='com.fairuniversal.offlineotp.dev'"; then
              echo "::error::Release APK has .dev applicationId: $apk"
              exit 1
            fi
            if ! "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -q "name='com.fairuniversal.offlineotp'"; then
              echo "::error::Release APK package is not com.fairuniversal.offlineotp: $apk"
              "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | head -n 20
              exit 1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -q "testOnly='1'"; then
              echo "::error::Release APK is testOnly: $apk"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Prepare signed APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk artifacts/OfflineOTP-fdroid-release.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk artifacts/OfflineOTP-play-release.apk
          (cd artifacts && sha256sum OfflineOTP-fdroid-release.apk OfflineOTP-play-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-android-release
          path: artifacts/
          if-no-files-found: error
      - name: Remove the decoded keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The runner is ephemeral, but the decoded keystore should not outlive the step that
          # needed it, even if a later step fails and the workspace is preserved for debugging.
          rm -f signing/OfflineOTP-release-keystore.jks
          rmdir signing 2>/dev/null || true
