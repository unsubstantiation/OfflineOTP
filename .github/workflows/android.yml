name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Probe YubiKit versions
        shell: bash
        run: |
          set -euo pipefail
          {
            for module in android core oath fido; do
              echo "### $module"
              curl -sS "https://repo1.maven.org/maven2/com/yubico/yubikit/$module/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | tail -12
            done
            echo "### android aar minCompileSdk"
            for v in 3.2.1 3.2.0 3.1.0 3.0.0; do
              if curl -sSf -o probe.aar "https://repo1.maven.org/maven2/com/yubico/yubikit/android/$v/android-$v.aar"; then
                echo "-- $v"
                unzip -p probe.aar META-INF/com/android/build/gradle/aar-metadata.properties 2>/dev/null | grep -i compile || echo "no metadata"
              else
                echo "-- $v MISSING"
              fi
            done
          } > probe.txt 2>&1
          cat probe.txt
          base64 -w0 probe.txt > probe.b64 || true
          printf '{"body":"%s"}' "$(cat probe.b64)" > body.json
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --data-binary @body.json || true
      - name: Build F-Droid debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleFdroidDebug 2>&1 | tee gradle-build.log
      - name: Report Gradle failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 40000 gradle-build.log | base64 -w0 > tail.b64 || true
          printf '{"body":"%s"}' "$(cat tail.b64)" > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --data-binary @body.json || true
      - name: Prepare APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk artifacts/OfflineOTP-fdroid-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/OfflineOTP-fdroid-debug.apk > artifacts/signing-certificate.txt
          (cd artifacts && sha256sum OfflineOTP-fdroid-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OfflineOTP-android-debug
          path: artifacts/
          if-no-files-found: error
