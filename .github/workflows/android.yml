name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep the v3 default SDK tools while updating the action runtime.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify Gradle wrapper inputs
        run: python3 scripts/check_build_inputs.py
      - name: Build F-Droid debug APK
        run: ./gradlew --no-daemon :app:assembleFdroidDebug
      - name: Inspect APK and prepare provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk artifacts/OfflineOTP-fdroid-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/OfflineOTP-fdroid-debug.apk > artifacts/signing-certificate.txt
          apkanalyzer manifest print artifacts/OfflineOTP-fdroid-debug.apk > artifacts/AndroidManifest.xml
          python3 scripts/check_debug_manifest.py artifacts/AndroidManifest.xml
          {
            printf 'Variant: fdroidDebug (debuggable; not for production)\n'
            printf 'Checked-out commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Workflow run: %s/%s/actions/runs/%s/attempts/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Manifest checks are not a malware scan or an independent attestation.\n'
          } > artifacts/build-provenance.txt
          (cd artifacts && sha256sum OfflineOTP-fdroid-debug.apk AndroidManifest.xml signing-certificate.txt build-provenance.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-android-debug
          path: artifacts/
          if-no-files-found: error
