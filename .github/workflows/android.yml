name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep the v3 default SDK tools while updating the action runtime.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build F-Droid debug APK
        run: ./gradlew --no-daemon :app:assembleFdroidDebug
      - name: Prepare APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk artifacts/OfflineOTP-fdroid-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/OfflineOTP-fdroid-debug.apk > artifacts/signing-certificate.txt
          (cd artifacts && sha256sum OfflineOTP-fdroid-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-android-debug
          path: artifacts/
          if-no-files-found: error

  signing-preflight:
    # Release signing is opt-in. The `secrets` context is not available to job-level `if`
    # expressions, so this tiny job publishes whether the keystore secret exists and lets the
    # signed-release job be *skipped* instead of *failed* when signing is not configured.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check release signing secret
        id: check
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_RELEASE_KEYSTORE" ]]; then
            echo "::notice::ANDROID_RELEASE_KEYSTORE is not configured; skipping the signed release build. See docs/release-signing.md to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  sign-release:
    # Builds and verifies signed release APKs only when the keystore is configured; otherwise
    # the job is skipped so the debug build and PR checks stay green. Never uploads release
    # artifacts that were not actually signed with the release key.
    needs: signing-preflight
    if: needs.signing-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep the v3 default SDK tools while updating the action runtime.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install release signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_RELEASE_KEYSTORE" ]]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE is not configured; a base64-encoded release keystore is required."
            exit 1
          fi
          mkdir -p signing
          if ! printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 -d > signing/OfflineOTP-release-keystore.jks; then
            echo "::error::ANDROID_RELEASE_KEYSTORE is not valid base64."
            exit 1
          fi
          if [[ ! -s signing/OfflineOTP-release-keystore.jks ]]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi
      - name: Build signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleFdroidRelease :app:assemblePlayRelease \
            -PRELEASE_STORE_FILE="$PWD/signing/OfflineOTP-release-keystore.jks" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}"
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
                     app/build/outputs/apk/play/release/app-play-release.apk; do
            test -f "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk"
          done
      - name: Prepare signed APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk artifacts/OfflineOTP-fdroid-release.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk artifacts/OfflineOTP-play-release.apk
          (cd artifacts && sha256sum OfflineOTP-fdroid-release.apk OfflineOTP-play-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-android-release
          path: artifacts/
          if-no-files-found: error
