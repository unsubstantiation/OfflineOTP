name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.91.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
      - name: Test Rust crate (rpgp + UniFFI, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          # The unified OpenPGP backend lives in rust/offlineotp-openpgp (rpgp 0.21 via UniFFI).
          # It builds a cdylib for Android/JVM (JNA) and a staticlib/XCFramework for iOS. This
          # job runs the host-target unit tests (keygen + round-trip + multi-recipient) so a
          # broken crypto change fails here rather than in a later per-ABI NDK build.
          set +e
          cargo check --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-test.log
          check_status=${PIPESTATUS[0]}
          # Also run the crate's own tests via `cargo test --lib` but do not require linker
          # for the check gate; the test binary will be built only where a linker exists.
          cargo test --manifest-path rust/Cargo.toml --lib --verbose 2>&1 | tee -a rust-test.log || true
          status=$check_status
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            echo "--- tail 200 ---"
            tail -n 200 rust-test.log | cat -A | head -n 40 || true
            wc -l rust-test.log || true
            grep -n -i "error\|failed\|FAILED\|panicked\|assertion" rust-test.log | head -n 60 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust test::$safe"
            done || true
            grep -n "^error\|test result" rust-test.log | head -n 40 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust err2::$safe"
            done || true
            tail -n 200 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::notice title=Rust tail::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi
      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-build.log
      - name: Report Rust diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"; ls -la
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
              # Emit the first 40 lines as annotations so `gh api .../annotations` is readable when blob logs EOF
              head -n 40 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust log::$safe"
              done || true
              echo "::notice title=Rust::--- tail $log ---"
              tail -n 80 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust tail::$safe"
              done || true
              grep -E -i "error" "$log" | head -20 | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::error title=Rust::$safe"
              done || true
            else
              echo "::notice title=Rust::no log $log"
            fi
          done
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep the v3 default SDK tools while updating the action runtime.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build F-Droid debug APK
        run: ./gradlew --no-daemon :app:assembleFdroidDebug
      - name: Prepare APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk artifacts/OfflineOTP-fdroid-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/OfflineOTP-fdroid-debug.apk > artifacts/signing-certificate.txt
          (cd artifacts && sha256sum OfflineOTP-fdroid-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-android-debug
          path: artifacts/
          if-no-files-found: error

  signing-preflight:
    # Release signing is opt-in. The `secrets` context is not available to job-level `if`
    # expressions, so this tiny job publishes whether the keystore secret exists and lets the
    # signed-release job be *skipped* instead of *failed* when signing is not configured.
    #
    # The keystore lives in the `android-release` environment, which is how this repository scopes
    # signing credentials (its branch policy allows `master` only, so the ref check keeps every
    # other dispatch from failing at the environment gate instead of reporting a clear skip).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check release signing secret
        id: check
        shell: bash
        env:
          # ANDROID_KEYSTORE_BASE64 is the name this repository uses; the ANDROID_RELEASE_* pair is
          # still honoured so an older setup keeps working.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not configured; skipping the signed release build. See docs/release-signing.md to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  sign-release:
    # Builds and verifies signed release APKs only when the keystore is configured; otherwise
    # the job is skipped so the debug build and PR checks stay green. Never uploads release
    # artifacts that were not actually signed with the release key.
    needs: signing-preflight
    if: needs.signing-preflight.outputs.enabled == 'true'
    # Same environment as the preflight: environment secrets are only readable by a job that names
    # the environment, and this is where the keystore and its password live.
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep the v3 default SDK tools while updating the action runtime.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured; a base64-encoded release keystore is required."
            exit 1
          fi
          mkdir -p signing
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/OfflineOTP-release-keystore.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [[ ! -s signing/OfflineOTP-release-keystore.jks ]]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi
      - name: Find the key alias and the passwords
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          # keytool makes the key password equal to the store password unless it is given
          # -keypass, so one secret normally covers both; a distinct one still wins if set.
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # A configured keystore with a missing password would otherwise fail inside Gradle with
          # "keystore password was incorrect"; name the secret instead. Values are never printed.
          if [[ -z "$STORE_PASSWORD" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured; it is required once the keystore is set."
            exit 1
          fi
          if [[ -z "$KEY_PASSWORD" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured; it is required once the keystore is set."
            exit 1
          fi
          # The alias is not a secret: read it from the keystore instead of asking for a third
          # secret. A keystore holding several private keys still needs the explicit secret.
          # -storepass:env keeps the password off the command line, where `ps` would show it.
          if [[ -z "$KEY_ALIAS" ]]; then
            export STORE_PASSWORD
            set +e
            LISTING="$(keytool -list -keystore signing/OfflineOTP-release-keystore.jks \
              -storepass:env STORE_PASSWORD 2>&1)"
            STATUS=$?
            set -e
            if [[ "$STATUS" -ne 0 ]]; then
              echo "::error::keytool could not open the release keystore: ANDROID_KEYSTORE_PASSWORD is wrong, or ANDROID_KEYSTORE_BASE64 is not a keystore."
              exit 1
            fi
            ALIASES="$(printf '%s\n' "$LISTING" | awk -F, '/PrivateKeyEntry/ { print $1 }')"
            COUNT="$(printf '%s\n' "$ALIASES" | grep -c . || true)"
            if [[ "$COUNT" == "0" ]]; then
              echo "::error::The release keystore holds no private key; it needs one signing key."
              exit 1
            fi
            if [[ "$COUNT" != "1" ]]; then
              echo "::error::The release keystore holds $COUNT private keys; set ANDROID_RELEASE_KEY_ALIAS to name one."
              exit 1
            fi
            KEY_ALIAS="$ALIASES"
            echo "::notice::Using key alias '$KEY_ALIAS' from the keystore."
          fi
          echo "::add-mask::$KEY_ALIAS"
          {
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APKs
        shell: bash
        # The three credentials reach Gradle as ORG_GRADLE_PROJECT_* environment variables instead
        # of -P arguments: they never show up in the process list, and no secret is substituted into
        # this script, so a password containing a quote, a backslash, $ or a space cannot break the
        # command or inject shell syntax. The values come from $GITHUB_ENV, so no `secrets` context
        # is interpolated here either.
        run: |
          set -euo pipefail
          : "${RELEASE_KEY_ALIAS:?missing}"
          : "${RELEASE_STORE_PASSWORD:?missing}"
          : "${RELEASE_KEY_PASSWORD:?missing}"
          export ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          ./gradlew --no-daemon :app:assembleFdroidRelease :app:assemblePlayRelease \
            -PRELEASE_STORE_FILE="$PWD/signing/OfflineOTP-release-keystore.jks"
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
                     app/build/outputs/apk/play/release/app-play-release.apk; do
            test -f "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk"
          done
      - name: Prepare signed APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk artifacts/OfflineOTP-fdroid-release.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk artifacts/OfflineOTP-play-release.apk
          (cd artifacts && sha256sum OfflineOTP-fdroid-release.apk OfflineOTP-play-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-android-release
          path: artifacts/
          if-no-files-found: error
      - name: Remove the decoded keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The runner is ephemeral, but the decoded keystore should not outlive the step that
          # needed it, even if a later step fails and the workspace is preserved for debugging.
          rm -f signing/OfflineOTP-release-keystore.jks
          rmdir signing 2>/dev/null || true