# TEMPORARY probe: which macOS runner labels can start in this repository right now, and what is on
# them. Deleted as soon as it has answered; see scripts/tests/test_no_github_automation.py for the set
# of workflows that is allowed to exist.
name: runner probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    # A label that cannot start must not fail the pull request: this job only reports, and the report
    # is a warning annotation because job logs are not readable from the tooling that asks.
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        label:
          - macos-15
          - macos-15-intel
    steps:
      - name: Where am I
        run: |
          echo "::warning::label=${{ matrix.label }} arch=$(uname -m) os=$(sw_vers -productVersion) xcode=$(xcodebuild -version | tr '\n' ' ')"
