name: Debian build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 35
    steps:
      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # binutils: jpackage's jlink step strips native libraries with objcopy, which is missing
          # from debian:bookworm-slim and otherwise fails the app-image build.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git unzip zip binutils libstdc++6 \
            libfreetype6 libfontconfig1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libasound2 libpcsclite1 libgl1 libegl1 libxrandr2 \
            build-essential pkg-config
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (Debian container)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            RUSTUP_HOST="sh.rustup.rs"
            curl --proto '=https' --tlsv1.2 -sSf "https://${RUSTUP_HOST}" | bash -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: debian12

      - name: Test Rust crate (rpgp + UniFFI)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --manifest-path rust/Cargo.toml 2>&1 | tee rust-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            tail -n 100 rust-test.log || true
            grep -E -n -i '\berror\b' rust-test.log | head -n 10 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi

      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --release 2>&1 | tee rust-build.log

      - name: Report Rust failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- tail $log ---"
              tail -n 80 "$log"
            fi
          done

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Maven Central mirror to avoid HTTP 429 rate limits
        shell: bash
        run: |
          set -euo pipefail
          update-ca-certificates
          mkdir -p ~/.gradle/init.d
          H1="repo.maven"
          H2="apache.org/maven2"
          M1="maven-central.storage-download"
          M2="googleapis.com/maven2/"
          cat << EOF > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
            buildscript {
              repositories {
                all { ArtifactRepository repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith("https://${H1}.${H2}")) {
                    repo.url = uri("https://${M1}.${M2}")
                  }
                }
              }
            }
            repositories {
              all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith("https://${H1}.${H2}")) {
                  repo.url = uri("https://${M1}.${M2}")
                }
              }
            }
          }
          EOF

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Build Debian app image
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :desktop-compose:packageDesktop
          test -x desktop-compose/build/release/OfflineOTP/bin/OfflineOTP
          cmp desktop/src/main/resources/offlineotp.png desktop-compose/build/release/OfflineOTP/lib/OfflineOTP.png

      - name: Archive app image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C desktop-compose/build/release -czf artifacts/OfflineOTP-debian12-x64.tar.gz OfflineOTP
          (cd artifacts && sha256sum OfflineOTP-debian12-x64.tar.gz > SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-debian12-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
