name: Debian build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 45
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git unzip zip libstdc++6 \
            libfreetype6 libfontconfig1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libasound2 libpcsclite1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Debian app image
        shell: bash
        run: |
          set -o pipefail
          set -u
          ./gradlew --no-daemon --console=plain :desktop:packageDesktop 2>&1 | tee gradle-build.log
          status=$?
          test -x desktop/build/release/OfflineOTP/bin/OfflineOTP
      - name: Probe JDK
        if: failure()
        shell: bash
        run: |
          {
            java -version 2>&1
            java --list-modules 2>&1 | grep -i smartcard || echo NO_SMARTCARD_MODULE
            printf 'public class T { Object o = javax.smartcardio.TerminalFactory.getDefault(); }\n' > T.java
            javac -d /tmp/o1 T.java && echo JAVAC_PLAIN_OK || echo JAVAC_PLAIN_FAIL
            javac --release 11 -d /tmp/o2 T.java && echo JAVAC_RELEASE11_OK || echo JAVAC_RELEASE11_FAIL
            ./gradlew --no-daemon --console=plain :desktop:compileKotlin --info 2>&1               | grep -i -E "jdk-release|jvm-target|jdk-home|jdkhome|smartcard|error:" | head -40
          } > probe.txt 2>&1 || true
          grep -v -E '^[[:space:]]+at ' probe.txt | tail -c 20000 | base64 -w0 > tail.b64
          printf '{"body":"%s"}' "$(cat tail.b64)" > body.json
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --data-binary @body.json || true
      - name: Report Gradle failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v -E '^[[:space:]]+at ' gradle-build.log | tail -c 20000 | base64 -w0 > tail.b64 || true
          printf '{"body":"%s"}' "$(cat tail.b64)" > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --data-binary @body.json || true
      - name: Archive app image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C desktop/build/release -czf artifacts/OfflineOTP-debian12-x64.tar.gz OfflineOTP
          (cd artifacts && sha256sum OfflineOTP-debian12-x64.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OfflineOTP-debian12-x64
          path: artifacts/
          if-no-files-found: error
