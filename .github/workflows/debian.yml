name: Debian build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 45
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git unzip zip libstdc++6 \
            libfreetype6 libfontconfig1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libasound2 libpcsclite1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Debian app image
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :desktop:packageDesktop
          test -x desktop/build/release/OfflineOTP/bin/OfflineOTP
      - name: Archive app image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C desktop/build/release -czf artifacts/OfflineOTP-debian12-x64.tar.gz OfflineOTP
          (cd artifacts && sha256sum OfflineOTP-debian12-x64.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OfflineOTP-debian12-x64
          path: artifacts/
          if-no-files-found: error
