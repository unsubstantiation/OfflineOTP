name: Debian build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 45
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          # binutils: jpackage's jlink step strips native libraries with objcopy, which is missing
          # from debian:bookworm-slim and otherwise fails the app-image build.
          apt-get install -y --no-install-recommends ca-certificates curl git unzip zip binutils libstdc++6 \
            libfreetype6 libfontconfig1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libasound2 libpcsclite1 \
            build-essential pkg-config
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust toolchain (Debian container)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version
          cargo --version
      - name: Test Rust crate (rpgp + UniFFI, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            echo "--- tail 200 raw ---"
            tail -n 200 rust-test.log || true
            wc -l rust-test.log || true
            echo "::group::Rust full tail as errors"
            tail -n 150 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::error title=Rust::$safe"
            done || true
            grep -E -n -i '\berror\b' rust-test.log | head -n 60 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust grep::$safe"
            done || true
            tail -n 200 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::notice title=Rust tail::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi
      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-build.log
      - name: Report Rust diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"; ls -la; echo "--- env ---"; env | sort | head -n 20
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
              # Emit the first 40 lines as annotations so `gh api .../annotations` is readable when blob logs EOF
              head -n 40 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust log::$safe"
              done || true
              echo "::notice title=Rust::--- tail $log ---"
              tail -n 80 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust tail::$safe"
              done || true
              grep -E -i '\berror\b' "$log" | head -20 | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust::$safe"
              done || true
            else
              echo "::notice title=Rust::no log $log"
            fi
          done
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Debian app image
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :desktop:packageDesktop
          test -x desktop/build/release/OfflineOTP/bin/OfflineOTP
          cmp desktop/src/main/resources/offlineotp.png desktop/build/release/OfflineOTP/lib/OfflineOTP.png
      - name: Archive app image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C desktop/build/release -czf artifacts/OfflineOTP-debian12-x64.tar.gz OfflineOTP
          (cd artifacts && sha256sum OfflineOTP-debian12-x64.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-debian12-x64
          path: artifacts/
          if-no-files-found: error
