name: Compose desktop validation

on:
  workflow_dispatch:
    inputs:
      regenerate_uniffi:
        description: 'Regenerate committed UniFFI bindings and push them to this branch after Rust tests pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: Compose build and headless tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
      - name: Verify wrapper provenance
        shell: bash
        run: python scripts/check_build_inputs.py
      - name: Compile, test and assemble the Compose distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/compose-desktop-validation
          git rev-parse HEAD > reports/compose-desktop-validation/commit.txt
          java -version 2> reports/compose-desktop-validation/java.txt
          bash ./gradlew --no-daemon --stacktrace :core:test :ui-model:desktopTest :desktop:test :desktop-compose:test :desktop-compose:installDist 2>&1 | tee reports/compose-desktop-validation/gradle.log
      - name: Upload validation evidence (no application or vault files)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-desktop-validation-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/compose-desktop-validation/
            core/build/test-results/
            ui-model/build/test-results/
            desktop/build/test-results/
            desktop-compose/build/test-results/

  scripted-hardware:
    name: Scripted hardware workflows (SDK substitutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned sandbox toolchain
        shell: bash
        run: bash scripts/kotlin-sandbox/bootstrap-toolchain.sh
      - name: Run desktop tests including scripted OATH and FIDO workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/compose-desktop-validation
          bash scripts/kotlin-sandbox/compile-desktop.sh 2>&1 | tee reports/compose-desktop-validation/scripted-hardware.log
      - name: Upload scripted test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-desktop-scripted-hardware
          if-no-files-found: warn
          retention-days: 14
          path: reports/compose-desktop-validation/scripted-hardware.log

  regenerate-uniffi:
    name: Regenerate and test UniFFI bindings (manual opt-in)
    if: ${{ inputs.regenerate_uniffi && github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Install the exact official generator
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/offlineotp-openpgp/Cargo.toml", "rb"))["dependencies"]["uniffi"].removeprefix("="))')"
          cargo install uniffi --features cli --bin uniffi-bindgen --version "=$version" --locked
      - name: Regenerate bindings and test the native implementation
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/openpgp/generate-bindings.sh
          bash scripts/openpgp/generate-bindings.sh --check
          cargo test --manifest-path rust/Cargo.toml
      - name: Commit only the generated bindings to the selected branch
        shell: bash
        run: |
          set -euo pipefail
          git add rust/bindings/kotlin/uniffi/offlineotp_openpgp/offlineotp_openpgp.kt \
            ios/Sources/offlineotp_openpgp/offlineotp_openpgp.swift \
            rust/bindings/swift/offlineotp_openpgpFFI.h \
            rust/bindings/swift/offlineotp_openpgpFFI.modulemap
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate UniFFI bindings with the pinned official generator'
          git push origin "HEAD:${GITHUB_REF_NAME}"
