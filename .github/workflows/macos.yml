name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # macos-14 is Apple silicon, so the app image (and its bundled JRE) targets arm64. The desktop
    # client is a pure-JVM Swing application, so this needs no Xcode project: jpackage produces the
    # .app bundle from the same sources the Windows and Debian jobs build.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the application icon
        shell: bash
        run: |
          set -euo pipefail
          # jpackage needs an .icns on macOS. It is built here from the same artwork the other
          # clients ship, so no binary icon has to be committed: an iconset is the layout iconutil
          # expects, and sips resamples the PNG into each size.
          ICONSET=build/offlineotp.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          SOURCE=desktop/src/main/resources/offlineotp.png
          test -s "$SOURCE"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" "$SOURCE" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" "$SOURCE" \
              --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o build/offlineotp.icns
          test -s build/offlineotp.icns
      - name: Build macOS app image
        shell: bash
        run: |
          set -euo pipefail
          # -PmacIconFile keeps the generated icon out of the source tree; the task falls back to
          # the default icon when the property is absent (a plain local build).
          ./gradlew --no-daemon :desktop:packageDesktop -PmacIconFile="$PWD/build/offlineotp.icns"
          APP=desktop/build/release/OfflineOTP.app
          test -d "$APP"
          test -x "$APP/Contents/MacOS/OfflineOTP"
          # The declared entry point has to survive into the bundle, or the app cannot start.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist" \
            | grep -qx OfflineOTP
      - name: Sign and verify the app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP=desktop/build/release/OfflineOTP.app
          # jpackage ad-hoc signs the app image; if the toolchain ever stops doing that, sign it
          # ad-hoc here so the bundle is self-consistent instead of failing verification.
          if ! codesign --verify --strict "$APP" 2>/dev/null; then
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --strict --verbose=2 "$APP"
          echo "::notice::Ad-hoc signed: the download runs after a Gatekeeper confirmation (right-click → Open) until it is signed with an Apple Developer ID."
      - name: Archive app bundle and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # ditto, not zip: it preserves the bundle's symlinks, executable bits and resource forks
          # that a plain zip would flatten into an unusable .app.
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/build/release/OfflineOTP.app artifacts/OfflineOTP-macos-arm64.zip
          # Smoke-test the archive itself: a bundle that lost its launcher is a broken download.
          mkdir -p build/unpacked
          ditto -x -k artifacts/OfflineOTP-macos-arm64.zip build/unpacked
          test -x build/unpacked/OfflineOTP.app/Contents/MacOS/OfflineOTP
          (cd artifacts && shasum -a 256 OfflineOTP-macos-arm64.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-macos-arm64
          path: artifacts/
          if-no-files-found: error
