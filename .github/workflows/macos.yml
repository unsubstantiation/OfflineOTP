name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    # macos-15 is Apple silicon (`uname -m` is arm64 on the image), so the app image and its bundled
    # JRE target arm64. It replaced macos-14, whose arm64 configuration stopped being startable:
    # jobs were cancelled before their first step with "The configuration
    # 'macos-14-arm64-us-default' is not supported". The desktop client is a pure-JVM Swing
    # application, so this needs no Xcode project: jpackage produces the .app bundle from the same
    # sources the Windows and Debian jobs build.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.91.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
      - name: Test Rust crate (rpgp + UniFFI, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            echo "--- tail 200 raw ---"
            tail -n 200 rust-test.log || true
            wc -l rust-test.log || true
            echo "::group::Rust full tail as errors"
            tail -n 150 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::error title=Rust::$safe"
            done || true
            grep -E -n -i '\berror\b' rust-test.log | head -n 60 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust grep::$safe"
            done || true
            tail -n 200 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::notice title=Rust tail::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi
      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-build.log
      - name: Report Rust diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"; ls -la
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
              # Emit the first 40 lines as annotations so `gh api .../annotations` is readable when blob logs EOF
              head -n 40 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust log::$safe"
              done || true
              echo "::notice title=Rust::--- tail $log ---"
              tail -n 80 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust tail::$safe"
              done || true
              grep -E -i '\berror\b' "$log" | head -20 | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust::$safe"
              done || true
            else
              echo "::notice title=Rust::no log $log"
            fi
          done
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the application icon
        shell: bash
        run: |
          set -euo pipefail
          # jpackage needs an .icns on macOS. It is built here from the same artwork the other
          # clients ship, so no binary icon has to be committed: an iconset is the layout iconutil
          # expects, and sips resamples the PNG into each size.
          ICONSET=build/offlineotp.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          SOURCE=desktop/src/main/resources/offlineotp.png
          test -s "$SOURCE"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" "$SOURCE" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" "$SOURCE" \
              --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o build/offlineotp.icns
          test -s build/offlineotp.icns
      - name: Build macOS app image
        shell: bash
        run: |
          set -euo pipefail
          # -PmacIconFile keeps the generated icon out of the source tree; the task falls back to
          # the default icon when the property is absent (a plain local build).
          ./gradlew --no-daemon :desktop:packageDesktop -PmacIconFile="$PWD/build/offlineotp.icns"
          APP=desktop/build/release/OfflineOTP.app
          test -d "$APP"
          test -x "$APP/Contents/MacOS/OfflineOTP"
          # The declared entry point has to survive into the bundle, or the app cannot start.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist" \
            | grep -qx OfflineOTP
      - name: Sign and verify the app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP=desktop/build/release/OfflineOTP.app
          # jpackage ad-hoc signs the app image; if the toolchain ever stops doing that, sign it
          # ad-hoc here so the bundle is self-consistent instead of failing verification.
          if ! codesign --verify --strict "$APP" 2>/dev/null; then
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --strict --verbose=2 "$APP"
          echo "::notice::Ad-hoc signed: the download runs after a Gatekeeper confirmation (right-click → Open) until it is signed with an Apple Developer ID."
      - name: Archive app bundle and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # ditto, not zip: it preserves the bundle's symlinks, executable bits and resource forks
          # that a plain zip would flatten into an unusable .app.
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/build/release/OfflineOTP.app artifacts/OfflineOTP-macos-arm64.zip
          # Smoke-test the archive itself: a bundle that lost its launcher is a broken download.
          mkdir -p build/unpacked
          ditto -x -k artifacts/OfflineOTP-macos-arm64.zip build/unpacked
          test -x build/unpacked/OfflineOTP.app/Contents/MacOS/OfflineOTP
          (cd artifacts && shasum -a 256 OfflineOTP-macos-arm64.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-macos-arm64
          path: artifacts/
          if-no-files-found: error
