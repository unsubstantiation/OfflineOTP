name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  openpgp-host:
    # The Rust crate's host tests do not need macOS. Run them in parallel with the Apple build so
    # they stay covered without spending the iOS job's 10-minute budget on a second host toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.91.0
        with:
          toolchain: stable
      - name: Check Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
      - name: Test Rust crate (rpgp + UniFFI, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-test.log
      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --release --verbose 2>&1 | tee rust-build.log
      - name: Report Rust diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for log in rust-test.log rust-build.log; do
            [ -f "$log" ] || continue
            grep -E -i '\berror\b' "$log" | head -20 | while IFS= read -r line; do
              [ -n "$line" ] || continue
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::error title=Rust::${safe}"
            done || true
          done
          exit 0

  build:
    # Apple-silicon iOS build and packaging, with a hard 10-minute budget. The simulator XCTest
    # step is deliberately not run here: it consumed the previous job's remaining 17 minutes after
    # the app had already compiled. The app still builds for the simulator, and the format suite
    # still runs on the macOS host. Local/manual app tests remain available through the generated
    # OfflineOTPAppTests target.
    #
    # `macos-15` is arm64 (verified on the image: `uname -m` is arm64, macOS 15.8.2, Xcode 16.4).
    # The shipped device/simulator artifacts are arm64, so CI builds only the arm64 Apple slices
    # of the OpenPGP XCFramework; the local script still defaults to the universal framework.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.91.0
        with:
          toolchain: stable
      - name: Show the toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Build OpenPGP XCFramework
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/openpgp/build-ios-xcframework.sh --arm64-only
      - name: Verify the token vectors are not stale
        shell: bash
        run: |
          set -euo pipefail
          # The vectors are generated by an implementation that is checked against the published
          # RFC 4226/6238 values, so a drifted fixture cannot quietly "prove" the Swift code right.
          python3 scripts/ios/generate-token-vectors.py
      - name: Check the generated thumbnail catalog is current
        shell: bash
        run: |
          set -euo pipefail
          # The name catalog is generated from `:core`; a stale copy would give an account added here
          # a different logo on the phone and the desktop.
          python3 scripts/ios/generate-thumbnail-catalog.py
      - name: Build the package
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # Optimized host build: the format tests repeatedly exercise the production Argon2id
          # parameters. Testability stays enabled for `@testable import OfflineOTPKit`.
          swift build -c release --build-tests -Xswiftc -enable-testing 2>&1 | tee build-log.txt
      - name: Run the format tests against the shared fixtures
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # The tests read desktop/src/test/resources/golden/ in place: the same vault, backups and
          # fixed parameters the JVM suites use. No signing identity and no simulator are involved.
          swift test -c release --parallel -Xswiftc -enable-testing 2>&1 | tee -a build-log.txt
      - name: Install XcodeGen
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # The Xcode project is generated from ios/project.yml rather than committed: a pbxproj is
          # an opaque, conflict-prone file, and the definition is five reviewable screens of YAML.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen \
            2>&1 | tee -a build-log.txt
          xcodegen --version
      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # A helper that appends a tool's output to the log *and* republishes it as annotations, so a
          # failure is diagnosable from the run page even when its output went somewhere else.
          annotate() {
            local title="$1"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error title=${title}::${line}"
            done
          }

          echo "--- xcodegen $(command -v xcodegen || echo missing) ---" >> build-log.txt
          xcodegen --version >> build-log.txt 2>&1 || true

          status=0
          output=$(xcodegen generate 2>&1) || status=$?
          printf '%s\n' "$output" >> build-log.txt
          echo "--- xcodegen exit status: $status ---" >> build-log.txt
          if [ "$status" -ne 0 ] || [ ! -d OfflineOTP.xcodeproj ]; then
            printf '%s\n' "$output" | annotate XcodeGen
            ls -la >> build-log.txt 2>&1
            exit 1
          fi

          status=0
          listing=$(xcodebuild -list -project OfflineOTP.xcodeproj 2>&1) || status=$?
          printf '%s\n' "$listing" >> build-log.txt
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$listing" | annotate xcodebuild
            exit 1
          fi
          printf '%s\n' "$listing" | grep -q OfflineOTPAppTests
      - name: Build the app for the simulator
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # No signing identity and no simulator boot: this proves the app and its package compile
          # for the arm64 simulator slice shipped by this Apple-silicon workflow.
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build-log.txt
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app
          xcrun lipo -archs build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app/OfflineOTP \
            | grep -qw arm64
      - name: Build the unsigned Release app for iOS devices
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # Build for physical iPhone/iPad hardware (iphoneos, arm64, Release) with signing
          # disabled so the .ipa can be sideloaded or signed locally without Apple credentials.
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build-log.txt
          test -d build/DerivedData/Build/Products/Release-iphoneos/OfflineOTP.app
          test -x build/DerivedData/Build/Products/Release-iphoneos/OfflineOTP.app/OfflineOTP
      - name: Package the sources that were tested
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage
          # A reproducible snapshot of the package plus the fixtures it is verified against, so the
          # archive can be unpacked and `swift test`-ed on its own.
          git archive HEAD ios | tar -x -C artifacts/stage
          git archive HEAD desktop/src/test/resources/golden | tar -x -C artifacts/stage
          (cd artifacts/stage && zip -q -r ../OfflineOTP-ios-kit-source.zip ios desktop)
      - name: Package the unsigned device IPA, simulator app, and checksums
        shell: bash
        run: |
          set -euo pipefail
          SIM_APP=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app
          DEV_APP=ios/build/DerivedData/Build/Products/Release-iphoneos/OfflineOTP.app
          test -d "$SIM_APP"
          test -d "$DEV_APP"

          # Simulator bundle: ditto keeps the bundle structure a plain zip would flatten.
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" artifacts/OfflineOTP-ios-simulator.zip
          mkdir -p build/unpacked
          ditto -x -k artifacts/OfflineOTP-ios-simulator.zip build/unpacked
          test -f build/unpacked/OfflineOTP.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build/unpacked/OfflineOTP.app/Info.plist | grep -qx OfflineOTP
          xcrun lipo -archs build/unpacked/OfflineOTP.app/OfflineOTP | grep -qw arm64

          # Unsigned physical-device .ipa: standard Payload/OfflineOTP.app layout without resource
          # forks so sideloaders on macOS, Windows, and Linux accept it directly.
          rm -rf build/ipa-stage build/unpacked-ipa
          mkdir -p build/ipa-stage/Payload build/unpacked-ipa
          ditto "$DEV_APP" build/ipa-stage/Payload/OfflineOTP.app
          ditto -c -k --norsrc build/ipa-stage artifacts/OfflineOTP-ios-unsigned.ipa
          ditto -x -k artifacts/OfflineOTP-ios-unsigned.ipa build/unpacked-ipa
          test -x build/unpacked-ipa/Payload/OfflineOTP.app/OfflineOTP
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build/unpacked-ipa/Payload/OfflineOTP.app/Info.plist | grep -qx OfflineOTP
          /usr/libexec/PlistBuddy -c 'Print :DTPlatformName' \
            build/unpacked-ipa/Payload/OfflineOTP.app/Info.plist | grep -qx iphoneos
          xcrun lipo -archs build/unpacked-ipa/Payload/OfflineOTP.app/OfflineOTP | grep -qw arm64
          xcrun vtool -show-build build/unpacked-ipa/Payload/OfflineOTP.app/OfflineOTP \
            | grep -Eq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$'

          (cd artifacts && shasum -a 256 \
            OfflineOTP-ios-unsigned.ipa \
            OfflineOTP-ios-simulator.zip \
            OfflineOTP-ios-kit-source.zip \
            > SHA256SUMS.txt)
      - name: Report diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # Attach the interesting lines of the build log to the run as annotations. This step exists
          # because a job log download is not always available (it is not for an automated agent), and
          # because a Swift, XcodeGen or xcodebuild diagnostic should be readable on the workflow run.
          if [ ! -f ios/build-log.txt ]; then
            echo "::notice::No build log was produced."
            exit 0
          fi
          pattern=': (error|warning): |error:|spec validation|damaged|cannot be opened|'
          pattern="${pattern}unable to (read|write|parse)|invalid (value|type)|not found"
          diagnostics=$(grep -E -i "$pattern" ios/build-log.txt | head -40 || true)
          if [ -z "$diagnostics" ]; then
            # Nothing matched, so fall back to the tail: a tool that failed for its own reasons still
            # said why somewhere in the last few lines.
            if grep -E -qi '\b(error|failed|cannot|unable)\b' ios/build-log.txt; then
              diagnostics=$(tail -30 ios/build-log.txt)
            fi
          fi
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::notice title=Build log::${line}"
          done <<< "$diagnostics"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-unsigned
          path: |
            artifacts/OfflineOTP-ios-unsigned.ipa
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-kit-source
          path: |
            artifacts/OfflineOTP-ios-kit-source.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: OfflineOTP-ios-diagnostics
          path: ios/build-log.txt
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-simulator
          path: |
            artifacts/OfflineOTP-ios-simulator.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
