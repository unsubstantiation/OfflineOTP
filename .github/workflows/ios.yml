name: iOS build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner image (Swift 6.2+ required)'
        required: true
        default: 'macos-26'
        type: choice
        options:
          - macos-latest
          - macos-26

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openpgp-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Check Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version

      - name: Test Rust crate (rpgp + UniFFI)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml 2>&1 | tee rust-test.log

      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --release 2>&1 | tee rust-build.log

      - name: Report Rust diagnostics
        if: ${{ !success() }}
        shell: bash
        run: |
          set -uo pipefail
          for log in rust-test.log rust-build.log; do
            [ -f "$log" ] || continue
            matches=$(grep -E '^error(\[[^]]+\])?:|^test result: FAILED' "$log" || true)
            [ -n "$matches" ] || continue
            count=0
            while IFS= read -r line; do
              count=$((count + 1))
              [ "$count" -le 20 ] || break
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::error title=Rust::${safe}"
            done <<< "$matches"
          done
          exit 0

  build:
    needs: openpgp-host
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # Cold Rust, Gradle/Kotlin Native and Xcode builds have separate bounded steps below.
    timeout-minutes: 75
    env:
      IOS_BUILD_LOG: ${{ github.workspace }}/ios/build-log.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0

      - name: Cache Rust iOS cross-compile artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: ios-xcframework
          
      # Do not rely on the runner image's default Java or an incidental Android SDK.
      # Root Gradle configures Android modules even when only building Kotlin Apple targets.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Cache Gradle packages and build cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Configure Maven Central mirror to avoid HTTP 429 rate limits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle/init.d
          H1="repo.maven"
          H2="apache.org/maven2"
          M1="maven-central.storage-download"
          M2="googleapis.com/maven2/"
          cat << EOF > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
            buildscript {
              repositories {
                all { ArtifactRepository repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith("https://${H1}.${H2}")) {
                    repo.url = uri("https://${M1}.${M2}")
                  }
                }
              }
            }
            repositories {
              all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith("https://${H1}.${H2}")) {
                  repo.url = uri("https://${M1}.${M2}")
                }
              }
            }
          }
          EOF

      - name: Show the toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -m
            rustc --version
            cargo --version
            java -version
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun swift --version
          } 2>&1 | tee -a "$IOS_BUILD_LOG"
          # The pinned SwiftLog package requires Swift tools 6.2, even while the app uses Swift 5 mode.
          python3 - <<'PYTHON'
          import re
          import subprocess
          import sys
          version = subprocess.check_output(["xcrun", "swift", "--version"], text=True)
          match = re.search(r"Swift version (\d+)\.(\d+)", version)
          if not match or tuple(map(int, match.groups())) < (6, 2):
              sys.exit("Select an Xcode toolchain with Swift 6.2 or later for the pinned YubiKit/SwiftLog packages.")
          PYTHON

      - name: Build OpenPGP XCFramework
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/openpgp/build-ios-xcframework.sh --arm64-only 2>&1 | tee -a "$IOS_BUILD_LOG"
          test -f ios/Frameworks/offlineotp_openpgp.xcframework/Info.plist

      - name: Verify the token vectors are not stale
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/generate-token-vectors.py

      - name: Check the generated thumbnail catalog is current
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/generate-thumbnail-catalog.py

      - name: Install XcodeGen
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen \
            2>&1 | tee -a "$IOS_BUILD_LOG"
          xcodegen --version

      - name: Generate the app icon
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/generate-app-icon.py
          python3 scripts/ios/generate-app-icon.py --check

      - name: Build required Compose presentation XCFramework
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK setup must provide ANDROID_HOME for root Gradle configuration}"
          java -version
          # Exercise shared Kotlin presentation policies, then compile the real iOS implementation.
          # Remaining Swift dependencies are compiled by xcodebuild, not a legacy SwiftPM test gate.
          ./gradlew --no-daemon :ui-model:desktopTest :ui-foundation:assembleOfflineOTPPresentationReleaseXCFramework \
            2>&1 | tee -a "$IOS_BUILD_LOG"
          test -f ui-foundation/build/XCFrameworks/release/OfflineOTPPresentation.xcframework/Info.plist
          mkdir -p ios/Frameworks
          rm -rf ios/Frameworks/OfflineOTPPresentation.xcframework
          ditto ui-foundation/build/XCFrameworks/release/OfflineOTPPresentation.xcframework \
            ios/Frameworks/OfflineOTPPresentation.xcframework
          test -f ios/Frameworks/OfflineOTPPresentation.xcframework/Info.plist

      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          annotate() {
            local title="$1"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error title=${title}::${line}"
            done
          }

          echo "--- xcodegen $(command -v xcodegen || echo missing) ---" >> build-log.txt
          xcodegen --version >> build-log.txt 2>&1 || true

          status=0
          output=$(xcodegen generate 2>&1) || status=$?
          printf '%s\n' "$output" >> build-log.txt
          echo "--- xcodegen exit status: $status ---" >> build-log.txt
          if [ "$status" -ne 0 ] || [ ! -d OfflineOTP.xcodeproj ]; then
            printf '%s\n' "$output" | annotate XcodeGen
            ls -la >> build-log.txt 2>&1
            exit 1
          fi

          status=0
          listing=$(xcodebuild -list -project OfflineOTP.xcodeproj 2>&1) || status=$?
          printf '%s\n' "$listing" >> build-log.txt
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$listing" | annotate xcodebuild
            exit 1
          fi
          printf '%s\n' "$listing" | grep -q OfflineOTPAppTests

      - name: Build the unsigned Release app for iOS devices
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            LD_GENERATE_MAP_FILE=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a "$IOS_BUILD_LOG"
          test -d build/DerivedData/Build/Products/Release-iphoneos/OfflineOTP.app
          test -x build/DerivedData/Build/Products/Release-iphoneos/OfflineOTP.app/OfflineOTP

      - name: Package the unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          DEV_APP=ios/build/DerivedData/Build/Products/Release-iphoneos/OfflineOTP.app
          test -d "$DEV_APP"

          mkdir -p artifacts
          rm -rf build/ipa-stage build/unpacked-ipa
          mkdir -p build/ipa-stage/Payload build/unpacked-ipa
          ditto "$DEV_APP" build/ipa-stage/Payload/OfflineOTP.app
          ditto -c -k --norsrc build/ipa-stage artifacts/OfflineOTP-ios-unsigned.ipa

          ditto -x -k artifacts/OfflineOTP-ios-unsigned.ipa build/unpacked-ipa
          test -x build/unpacked-ipa/Payload/OfflineOTP.app/OfflineOTP
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build/unpacked-ipa/Payload/OfflineOTP.app/Info.plist | grep -qx OfflineOTP
          /usr/libexec/PlistBuddy -c 'Print :DTPlatformName' \
            build/unpacked-ipa/Payload/OfflineOTP.app/Info.plist | grep -qx iphoneos
          xcrun lipo -archs build/unpacked-ipa/Payload/OfflineOTP.app/OfflineOTP | grep -qw arm64
          xcrun vtool -show-build build/unpacked-ipa/Payload/OfflineOTP.app/OfflineOTP \
            | grep -Eq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$'

          python3 scripts/ios/report-ipa-contents.py \
            --ipa artifacts/OfflineOTP-ios-unsigned.ipa \
            --link-map-dir ios/build/DerivedData \
            --annotate

      - name: Report diagnostics
        if: ${{ !success() }}
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f ios/build-log.txt ]; then
            echo "::notice::No build log was produced."
            exit 0
          fi
          pattern=': (error|warning): |error:|^e: |FAILURE:|spec validation|damaged|cannot be opened|'
          pattern="${pattern}unable to (read|write|parse)|invalid (value|type)|not found"
          matches=$(grep -E -i "$pattern" ios/build-log.txt || true)
          if [ -z "$matches" ] && grep -E -qi '\b(error|failed|cannot|unable)\b' ios/build-log.txt; then
            matches=$(tail -30 ios/build-log.txt)
          fi
          count=0
          while IFS= read -r line; do
            count=$((count + 1))
            [ "$count" -le 40 ] || break
            [ -n "$line" ] || continue
            echo "::notice title=Build log::${line}"
          done <<< "$matches"
          exit 0

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-unsigned
          archive: false
          path: artifacts/OfflineOTP-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
