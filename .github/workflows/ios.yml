name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # One workflow per platform, as with the Android, Windows, Debian and macOS builds. This job
    # tests the shared format layer (`ios/`, a Swift package) and builds the app shell for the
    # simulator, on an Apple silicon runner. Nothing here signs for a device or publishes anything:
    # package signing and TestFlight stay manual, as releases do on the other platforms. See
    # docs/ios-client-plan.md.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Show the toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Verify the token vectors are not stale
        shell: bash
        run: |
          set -euo pipefail
          # The vectors are generated by an implementation that is checked against the published
          # RFC 4226/6238 values, so a drifted fixture cannot quietly "prove" the Swift code right.
          python3 scripts/ios/generate-token-vectors.py
      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # `tee` keeps the diagnostics: the next step turns them into annotations, which is the only
          # way to read a compiler error from the run without downloading the job log.
          swift build --build-tests 2>&1 | tee build-log.txt
      - name: Run the format tests against the shared fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # The tests read desktop/src/test/resources/golden/ in place: the same vault, backups and
          # fixed parameters the JVM suites use. No signing identity and no simulator are involved.
          swift test --parallel 2>&1 | tee -a build-log.txt
      - name: Report diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # Attach each diagnostic to the run as an annotation, so a failure is readable on the pull
          # request instead of buried in a log download. This step must never fail the job by itself:
          # a clean build has nothing to report, and grep exits 1 when it matches nothing.
          [ -f ios/build-log.txt ] || exit 0
          diagnostics=$(grep -E -i ': (error|warning): |error:|spec validation|damaged|'
            'cannot be opened|unable to (read|write|parse)|invalid (value|type)' \
            ios/build-log.txt | head -40 || true)
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *": error: "*) echo "::error title=Swift::${line}" ;;
              *) echo "::warning title=Swift::${line}" ;;
            esac
          done <<< "$diagnostics"
          exit 0
      - name: Build for the iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # Proves the code compiles for iOS itself, not only for the macOS host. A generic
          # destination needs no booted simulator and no code signing.
          xcodebuild -scheme OfflineOTPKit \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -quiet build
          # Whatever the linker emits for a library target, something has to carry the module name.
          find build/DerivedData -name 'OfflineOTPKit*' -print -quit | grep .
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          # The Xcode project is generated from ios/project.yml rather than committed: a pbxproj is
          # an opaque, conflict-prone file, and the definition is five reviewable screens of YAML.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen \
            2>&1 | tee -a build-log.txt
          xcodegen --version
      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate 2>&1 | tee -a build-log.txt
          test -d OfflineOTP.xcodeproj
          xcodebuild -list -project OfflineOTP.xcodeproj 2>&1 | tee -a build-log.txt
      - name: Build the app for the simulator
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # No signing identity: a simulator build does not need one, and this job must stay runnable
          # by someone with no Apple developer account.
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build-log.txt
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app
      - name: Run the app unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # An explicit simulator, because `test` needs a concrete device. Picking it here means a
          # runner image that renames its devices (iPhone 15 -> iPhone 16) does not break the job.
          UDID=$(xcrun simctl list devices available --json | jq -er '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime.iOS-"))
              | .value[]
              | select(.isAvailable and (.name | startswith("iPhone"))) ]
            | last
            | .udid')
          echo "::notice::Testing on the simulator $UDID"
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee -a build-log.txt
      - name: Package the sources that were tested
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage
          # A reproducible snapshot of the package plus the fixtures it is verified against, so the
          # archive can be unpacked and `swift test`-ed on its own.
          git archive HEAD ios | tar -x -C artifacts/stage
          git archive HEAD desktop/src/test/resources/golden | tar -x -C artifacts/stage
          (cd artifacts/stage && zip -q -r ../OfflineOTP-ios-kit-source.zip ios desktop)
      - name: Package the simulator app and checksum everything
        shell: bash
        run: |
          set -euo pipefail
          APP=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app
          test -d "$APP"
          # ditto, as on macOS: a bundle has structure a plain zip would flatten.
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/OfflineOTP-ios-simulator.zip
          mkdir -p build/unpacked
          ditto -x -k artifacts/OfflineOTP-ios-simulator.zip build/unpacked
          test -f build/unpacked/OfflineOTP.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build/unpacked/OfflineOTP.app/Info.plist | grep -qx OfflineOTP
          (cd artifacts && shasum -a 256 OfflineOTP-ios-kit-source.zip OfflineOTP-ios-simulator.zip \
            > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-kit-source
          path: |
            artifacts/OfflineOTP-ios-kit-source.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-simulator
          path: |
            artifacts/OfflineOTP-ios-simulator.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
