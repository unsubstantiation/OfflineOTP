name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    # One workflow per platform, as with the Android, Windows, Debian and macOS builds. This job
    # tests the shared format layer (`ios/`, a Swift package) and builds the app shell for the
    # simulator, on an Apple silicon runner. Nothing here signs for a device or publishes anything:
    # package signing and TestFlight stay manual, as releases do on the other platforms. See
    # docs/ios-client-plan.md.
    #
    # `macos-15` is arm64 (verified on the image: `uname -m` is arm64, macOS 15.8.2, Xcode 16.4).
    # It replaced `macos-14` because that image's arm64 configuration stopped being startable:
    # every job was cancelled before its first step with "The configuration
    # 'macos-14-arm64-us-default' is not supported", on all three `macos-14*` labels, while
    # `macos-15` and `macos-15-intel` started normally. Both are Apple silicon, so the app target is
    # unchanged; only the Xcode that builds it moved forward.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.91.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
      - name: Test Rust crate (rpgp + UniFFI, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            echo "--- tail 200 raw ---"
            tail -n 200 rust-test.log || true
            wc -l rust-test.log || true
            echo "::group::Rust full tail as errors"
            tail -n 150 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::error title=Rust::$safe"
            done || true
            grep -E -n -i '\berror\b' rust-test.log | head -n 60 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust grep::$safe"
            done || true
            tail -n 200 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::notice title=Rust tail::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi
      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-build.log
      - name: Report Rust diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"; ls -la
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
              # Emit the first 40 lines as annotations so `gh api .../annotations` is readable when blob logs EOF
              head -n 40 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust log::$safe"
              done || true
              echo "::notice title=Rust::--- tail $log ---"
              tail -n 80 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust tail::$safe"
              done || true
              grep -E -i '\berror\b' "$log" | head -20 | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::error title=Rust::$safe"
              done || true
            else
              echo "::notice title=Rust::no log $log"
            fi
          done
      - name: Show the toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Verify the token vectors are not stale
        shell: bash
        run: |
          set -euo pipefail
          # The vectors are generated by an implementation that is checked against the published
          # RFC 4226/6238 values, so a drifted fixture cannot quietly "prove" the Swift code right.
          python3 scripts/ios/generate-token-vectors.py
      - name: Check the generated thumbnail catalog is current
        shell: bash
        run: |
          set -euo pipefail
          # The name catalog is generated from `:core`; a stale copy would give an account added here
          # a different logo on the phone and the desktop.
          python3 scripts/ios/generate-thumbnail-catalog.py
      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # `tee` keeps the diagnostics: the next step turns them into annotations, which is the only
          # way to read a compiler error from the run without downloading the job log.
          swift build --build-tests 2>&1 | tee build-log.txt
      - name: Run the format tests against the shared fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # The tests read desktop/src/test/resources/golden/ in place: the same vault, backups and
          # fixed parameters the JVM suites use. No signing identity and no simulator are involved.
          swift test --parallel 2>&1 | tee -a build-log.txt
      - name: Build for the iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # Proves the code compiles for iOS itself, not only for the macOS host. A generic
          # destination needs no booted simulator and no code signing.
          xcodebuild -scheme OfflineOTPKit \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -quiet build
          # Whatever the linker emits for a library target, something has to carry the module name.
          find build/DerivedData -name 'OfflineOTPKit*' -print -quit | grep .
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          # The Xcode project is generated from ios/project.yml rather than committed: a pbxproj is
          # an opaque, conflict-prone file, and the definition is five reviewable screens of YAML.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen \
            2>&1 | tee -a build-log.txt
          xcodegen --version
      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # A helper that appends a tool's output to the log *and* republishes it as annotations, so a
          # failure is diagnosable from the run page even when its output went somewhere else.
          annotate() {
            local title="$1"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error title=${title}::${line}"
            done
          }

          echo "--- xcodegen $(command -v xcodegen || echo missing) ---" >> build-log.txt
          xcodegen --version >> build-log.txt 2>&1 || true

          status=0
          output=$(xcodegen generate 2>&1) || status=$?
          printf '%s\n' "$output" >> build-log.txt
          echo "--- xcodegen exit status: $status ---" >> build-log.txt
          if [ "$status" -ne 0 ] || [ ! -d OfflineOTP.xcodeproj ]; then
            printf '%s\n' "$output" | annotate XcodeGen
            ls -la >> build-log.txt 2>&1
            exit 1
          fi

          status=0
          listing=$(xcodebuild -list -project OfflineOTP.xcodeproj 2>&1) || status=$?
          printf '%s\n' "$listing" >> build-log.txt
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$listing" | annotate xcodebuild
            exit 1
          fi
          printf '%s\n' "$listing" | grep -q OfflineOTPAppTests
      - name: Build the app for the simulator
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # No signing identity: a simulator build does not need one, and this job must stay runnable
          # by someone with no Apple developer account.
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build-log.txt
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app
      - name: Run the app unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          # An explicit simulator, because `test` needs a concrete device. Picking it here means a
          # runner image that renames its devices (iPhone 15 -> iPhone 16) does not break the job.
          UDID=$(xcrun simctl list devices available --json | jq -er '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime.iOS-"))
              | .value[]
              | select(.isAvailable and (.name | startswith("iPhone"))) ]
            | last
            | .udid')
          echo "::notice::Testing on the simulator $UDID"
          xcodebuild -project OfflineOTP.xcodeproj -scheme OfflineOTP \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee -a build-log.txt
      - name: Package the sources that were tested
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage
          # A reproducible snapshot of the package plus the fixtures it is verified against, so the
          # archive can be unpacked and `swift test`-ed on its own.
          git archive HEAD ios | tar -x -C artifacts/stage
          git archive HEAD desktop/src/test/resources/golden | tar -x -C artifacts/stage
          (cd artifacts/stage && zip -q -r ../OfflineOTP-ios-kit-source.zip ios desktop)
      - name: Package the simulator app and checksum everything
        shell: bash
        run: |
          set -euo pipefail
          APP=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/OfflineOTP.app
          test -d "$APP"
          # ditto, as on macOS: a bundle has structure a plain zip would flatten.
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/OfflineOTP-ios-simulator.zip
          mkdir -p build/unpacked
          ditto -x -k artifacts/OfflineOTP-ios-simulator.zip build/unpacked
          test -f build/unpacked/OfflineOTP.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build/unpacked/OfflineOTP.app/Info.plist | grep -qx OfflineOTP
          (cd artifacts && shasum -a 256 OfflineOTP-ios-kit-source.zip OfflineOTP-ios-simulator.zip \
            > SHA256SUMS.txt)
      - name: Report diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # Attach the interesting lines of the build log to the run as annotations. This step exists
          # because a job log download is not always available (it is not for an automated agent), and
          # because a Swift, XcodeGen or xcodebuild diagnostic should be readable on the pull request.
          if [ ! -f ios/build-log.txt ]; then
            echo "::notice::No build log was produced."
            exit 0
          fi
          pattern=': (error|warning): |error:|spec validation|damaged|cannot be opened|'
          pattern="${pattern}unable to (read|write|parse)|invalid (value|type)|not found"
          diagnostics=$(grep -E -i "$pattern" ios/build-log.txt | head -40 || true)
          if [ -z "$diagnostics" ]; then
            # Nothing matched, so fall back to the tail: a tool that failed for its own reasons still
            # said why somewhere in the last few lines.
            if grep -E -qi '\b(error|failed|cannot|unable)\b' ios/build-log.txt; then
              diagnostics=$(tail -30 ios/build-log.txt)
            fi
          fi
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::notice title=Build log::${line}"
          done <<< "$diagnostics"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-kit-source
          path: |
            artifacts/OfflineOTP-ios-kit-source.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-ios-simulator
          path: |
            artifacts/OfflineOTP-ios-simulator.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
