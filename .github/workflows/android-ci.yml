name: Android CI

# The quality gate: source guards, host-side tests, build+lint+manifest policy, the
# instrumentation matrix on emulators, and (on master or manual dispatch) the reproducibility
# check. The four build-*-apk.yml workflows remain the per-variant artifact producers.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python source guards
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build input provenance
        run: python3 scripts/check_build_inputs.py

  host-tests:
    name: Host tests (sandbox toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap the sandbox toolchain
        run: scripts/kotlin-sandbox/bootstrap-toolchain.sh

      - name: Kotlin sandbox check
        run: |
          export PATH="/tmp/kotlin-sandbox-toolchain/jdk/jdk4py/java-runtime/bin:$PATH"
          scripts/kotlin-sandbox/run.sh

      - name: JVM unit tests
        run: scripts/run-jvm-tests.sh

      - name: Instrumentation sources compile
        run: scripts/kotlin-sandbox/compile-android-tests.sh

      - name: Harness guards (with the toolchain present)
        run: python3 -m unittest discover -s scripts/tests -p 'test_jvm_test_suite.py' -v

  build-and-lint:
    name: Build, host unit tests, lint and manifest policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Assemble all variants and instrumentation APKs
        run: |
          log_file="$(mktemp)"
          set +e
          ./gradlew --no-daemon --console=plain \
            :app:assembleFdroidDebug :app:assembleFdroidRelease \
            :app:assemblePlayDebug :app:assemblePlayRelease \
            :app:assembleFdroidDebugAndroidTest :app:assemblePlayDebugAndroidTest \
            >"$log_file" 2>&1
          gradle_status=$?
          set -e
          cat "$log_file"

          if [[ $gradle_status -ne 0 ]]; then
            diagnostics="$(grep -E '(^e: |^FAILURE:|^Execution failed for task|^> Task .* FAILED|^Could not resolve|^[[:space:]]*> (Could not|Compilation error|A problem occurred)|^Caused by:)' "$log_file" | tail -n 30 || true)"
            if [[ -z "$diagnostics" ]]; then
              diagnostics="$(tail -n 30 "$log_file")"
            fi
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              printf '::error title=Gradle assembly failure::%s\n' "$line"
            done <<< "$diagnostics"
          fi

          rm -f "$log_file"
          exit "$gradle_status"

      - name: Host unit tests (Gradle, real JUnit)
        run: ./gradlew --no-daemon :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest

      - name: Lint all variants
        run: >
          ./gradlew --no-daemon :app:lintFdroidDebug :app:lintFdroidRelease
          :app:lintPlayDebug :app:lintPlayRelease

      - name: Manifest policy (packaged APKs)
        run: |
          mkdir -p reports/manifests
          for flavor in fdroid play; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            test -f "$apk"
            apkanalyzer manifest print "$apk" > "reports/manifests/$flavor-manifest.xml"
            python3 scripts/check_manifest.py "reports/manifests/$flavor-manifest.xml"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-apk-and-manifests
          path: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/play/release/*.apk
            reports/manifests/
          if-no-files-found: error

  instrumentation:
    name: Instrumentation ${{ matrix.flavor }} / API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    needs: build-and-lint
    strategy:
      fail-fast: false
      matrix:
        flavor: [fdroid, play]
        api: ['28', '36']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools emulator platforms;android-36 build-tools;36.0.0'

      - name: Enable KVM access for the emulator
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error title=Android emulator preflight::/dev/kvm is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error title=Android emulator preflight::runner cannot read and write /dev/kvm"
            exit 1
          fi
          stat -c 'KVM device permissions: %A %U:%G' /dev/kvm

      - name: Emulator lifecycle and connected tests
        run: scripts/ci/start-emulator.sh ${{ matrix.flavor }} ${{ matrix.api }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: instrumentation-${{ matrix.flavor }}-api${{ matrix.api }}-logs
          path: |
            reports/emulator/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  reproducibility:
    name: Reproducible builds
    runs-on: ubuntu-24.04
    # Only on master or manual runs: two full builds per invocation are expensive.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Two independent builds must match byte for byte
        run: scripts/verify_reproducible_build.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reproducibility-report
          path: reports/reproducibility/
          if-no-files-found: ignore
