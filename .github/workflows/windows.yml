name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Windows app image
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --stacktrace --console=plain :desktop:packageDesktop 2>&1 | Tee-Object -FilePath gradle-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'desktop/build/release/OfflineOTP/OfflineOTP.exe' -PathType Leaf)) {
            throw 'jpackage did not produce the Windows launcher'
          }
      - name: Report Gradle failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path gradle-build.log)) { exit 0 }
          $tail = (Get-Content gradle-build.log -Tail 400) -join "`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows gradle tail`n`n``````n$tail`n``````"
          @{ body = "windows gradle tail`n```n$tail`n```" } | ConvertTo-Json | Out-File -Encoding utf8 body.json
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input body.json
      - name: Archive app image and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path desktop/build/release/OfflineOTP -DestinationPath artifacts/OfflineOTP-windows-x64.zip
          $hash = (Get-FileHash artifacts/OfflineOTP-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", "$hash  OfflineOTP-windows-x64.zip`n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OfflineOTP-windows-x64
          path: artifacts/
          if-no-files-found: error
