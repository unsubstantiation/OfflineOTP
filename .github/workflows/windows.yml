name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Test Rust crate (rpgp + UniFFI)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --manifest-path rust/Cargo.toml 2>&1 | tee rust-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            tail -n 100 rust-test.log || true
            grep -E -n -i '\berror\b' rust-test.log | head -n 10 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi

      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --release 2>&1 | tee rust-build.log

      - name: Report Rust failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- tail $log ---"
              tail -n 80 "$log"
            fi
          done

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages and build cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Build Windows app image
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :desktop-compose:packageDesktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'desktop-compose/build/release/OfflineOTP/OfflineOTP.exe' -PathType Leaf)) {
            throw 'jpackage did not produce the Windows launcher'
          }

      - name: Archive app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path desktop-compose/build/release/OfflineOTP -DestinationPath artifacts/OfflineOTP-windows-x64.zip

      - name: Upload Windows app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-windows-x64
          archive: false
          path: artifacts/OfflineOTP-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
