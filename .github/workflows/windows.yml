name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.91.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
      - name: Test Rust crate (rpgp + UniFFI, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --manifest-path rust/Cargo.toml --verbose 2>&1 | tee rust-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::group::Rust test failure tail"
            echo "--- tail 200 raw ---"
            tail -n 200 rust-test.log || true
            wc -l rust-test.log || true
            echo "::group::Rust full tail as errors"
            tail -n 150 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::error title=Rust::$safe"
            done || true
            grep -E -n -i '\berror\b' rust-test.log | head -n 60 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              echo "::error title=Rust grep::$safe"
            done || true
            tail -n 200 rust-test.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
              [ -n "$safe" ] || continue
              echo "::notice title=Rust tail::$safe"
            done || true
            echo "::endgroup::"
            exit $status
          fi
      - name: Build Rust crate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --release --verbose 2>&1 | tee rust-build.log
      - name: Report Rust diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"; ls -la
          for log in rust-test.log rust-build.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
              # Emit the first 40 lines as annotations so `gh api .../annotations` is readable when blob logs EOF
              head -n 40 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust log::$safe"
              done || true
              echo "::notice title=Rust::--- tail $log ---"
              tail -n 80 "$log" | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust tail::$safe"
              done || true
              grep -E -i '\berror\b' "$log" | head -20 | while IFS= read -r line; do
                [ -n "$line" ] || continue
                safe=$(printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-220)
                [ -n "$safe" ] || continue
                echo "::notice title=Rust::$safe"
              done || true
            else
              echo "::notice title=Rust::no log $log"
            fi
          done
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Windows app image
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :desktop:packageDesktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'desktop/build/release/OfflineOTP/OfflineOTP.exe' -PathType Leaf)) {
            throw 'jpackage did not produce the Windows launcher'
          }
      - name: Archive app image and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path desktop/build/release/OfflineOTP -DestinationPath artifacts/OfflineOTP-windows-x64.zip
          $hash = (Get-FileHash artifacts/OfflineOTP-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", "$hash  OfflineOTP-windows-x64.zip`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflineOTP-windows-x64
          path: artifacts/
          if-no-files-found: error
